<svg width="1200" height="675" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="675" fill="#f5f7f7"/>
  <rect x="0" y="0" width="1200" height="44" fill="#0e3b36"/>
  <circle cx="24" cy="22" r="6" fill="#ff5f57"/><circle cx="44" cy="22" r="6" fill="#febc2e"/><circle cx="64" cy="22" r="6" fill="#28c840"/>
  <rect x="90" y="10" width="1020" height="24" rx="12" fill="#124a43"/>
  <text x="600" y="26" font-family="monospace" font-size="12" fill="#dcece9" text-anchor="middle">smart-health.vercel.app — NTR District Command Center</text>

  <!-- sidebar -->
  <rect x="0" y="44" width="220" height="631" fill="#0e3b36"/>
  <text x="30" y="90" font-family="Georgia, serif" font-size="20" fill="#ffffff" font-weight="bold">Smart Health</text>
  <g font-family="Arial" font-size="14" fill="#a8c9c4">
    <rect x="20" y="115" width="180" height="34" rx="8" fill="#2f9d8f"/>
    <text x="35" y="137" fill="#06201d" font-weight="bold">Overview</text>
    <text x="35" y="180">Queue &amp; Beds</text>
    <text x="35" y="215">Inventory</text>
    <text x="35" y="250">Forecast</text>
    <text x="35" y="285">Districts</text>
  </g>

  <!-- top stat cards -->
  <g font-family="Arial">
    <rect x="245" y="75" width="220" height="90" rx="10" fill="#ffffff" stroke="#dde4e2"/>
    <text x="265" y="105" font-size="13" fill="#4b5b58">Active Queue</text>
    <text x="265" y="140" font-size="30" font-weight="bold" fill="#124a43">128</text>

    <rect x="480" y="75" width="220" height="90" rx="10" fill="#ffffff" stroke="#dde4e2"/>
    <text x="500" y="105" font-size="13" fill="#4b5b58">Beds Available</text>
    <text x="500" y="140" font-size="30" font-weight="bold" fill="#124a43">42</text>

    <rect x="715" y="75" width="220" height="90" rx="10" fill="#ffffff" stroke="#dde4e2"/>
    <text x="735" y="105" font-size="13" fill="#4b5b58">Staff On Duty</text>
    <text x="735" y="140" font-size="30" font-weight="bold" fill="#124a43">19</text>

    <rect x="950" y="75" width="220" height="90" rx="10" fill="#ffffff" stroke="#dde4e2"/>
    <text x="970" y="105" font-size="13" fill="#4b5b58">Live Status</text>
    <circle cx="975" cy="140" r="6" fill="#2f9d8f"/>
    <text x="990" y="145" font-size="18" font-weight="bold" fill="#124a43">Connected</text>
  </g>

  <!-- chart panel -->
  <rect x="245" y="190" width="500" height="280" rx="10" fill="#ffffff" stroke="#dde4e2"/>
  <text x="265" y="220" font-family="Georgia, serif" font-size="16" fill="#0f2320" font-weight="bold">Patient Forecast (7-day)</text>
  <polyline points="270,420 330,390 390,400 450,340 510,360 570,300 630,320 690,270" fill="none" stroke="#2f9d8f" stroke-width="3"/>
  <polyline points="270,440 330,430 390,420 450,410 510,420 570,400 630,410 690,395" fill="none" stroke="#c98a3c" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- right panel: bed occupancy -->
  <rect x="765" y="190" width="405" height="280" rx="10" fill="#ffffff" stroke="#dde4e2"/>
  <text x="785" y="220" font-family="Georgia, serif" font-size="16" fill="#0f2320" font-weight="bold">Beds by Facility</text>
  <g font-family="IBM Plex Mono, monospace" font-size="12" fill="#4b5b58">
    <text x="785" y="250">PHC-GOVERNORPET</text><rect x="785" y="258" width="360" height="10" rx="5" fill="#eef2f1"/><rect x="785" y="258" width="230" height="10" rx="5" fill="#2f9d8f"/>
    <text x="785" y="290">CHC-VIJAYAWADA</text><rect x="785" y="298" width="360" height="10" rx="5" fill="#eef2f1"/><rect x="785" y="298" width="150" height="10" rx="5" fill="#2f9d8f"/>
    <text x="785" y="330">DH-NTR</text><rect x="785" y="338" width="360" height="10" rx="5" fill="#eef2f1"/><rect x="785" y="338" width="300" height="10" rx="5" fill="#c98a3c"/>
  </g>

  <text x="245" y="530" font-family="Arial" font-size="14" fill="#4b5b58">React · Node/Express · GraphQL · Prisma · MongoDB · Socket.io live updates</text>
</svg>
